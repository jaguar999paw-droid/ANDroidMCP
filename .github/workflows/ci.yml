name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.27.2,<2" httpx

      - name: Byte-compile servers
        run: python -m compileall -q servers

      - name: Shell syntax check
        run: |
          for f in scripts/*.sh scripts/release/install.sh; do bash -n "$f"; done

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: No personal paths or tokens in tracked files
        run: |
          if git grep -nIE '/home/[a-z][a-z0-9_-]*/|tskey-(auth|api)-[A-Za-z0-9]+' -- . ':!GAP.md' ':!.github'; then
            echo "Found a hardcoded home path or Tailscale key" >&2
            exit 1
          fi
