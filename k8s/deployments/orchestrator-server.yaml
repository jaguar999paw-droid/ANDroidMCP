---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-sa
  namespace: androidmcp

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orchestrator-state-pvc
  namespace: androidmcp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestrator-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestrator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orchestrator-role
subjects:
  - kind: ServiceAccount
    name: orchestrator-sa
    namespace: androidmcp

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-orchestrator-server
  namespace: androidmcp
  labels:
    app: k8s-orchestrator
    risk-tier: low
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-orchestrator
  template:
    metadata:
      labels:
        app: k8s-orchestrator
        risk-tier: low
    spec:
      serviceAccountName: orchestrator-sa
      containers:
        - name: orchestrator-mcp
          image: androidmcp/orchestrator-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8112
              protocol: TCP
          env:
            - name: MCP_PORT
              value: "8112"
            - name: ORCHESTRATOR_NAMESPACE
              value: androidmcp
            - name: ANDROIDMCP_STATE_FILE
              value: "/data/device_states.json"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8112
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8112
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: orchestrator-state
              mountPath: /data

        - name: orchestrator-state
          persistentVolumeClaim:
            claimName: orchestrator-state-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-orchestrator
  namespace: androidmcp
spec:
  type: ClusterIP
  selector:
    app: k8s-orchestrator
  ports:
    - name: http
      port: 8112
      targetPort: 8112
