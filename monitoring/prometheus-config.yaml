# ANDroidMCP Prometheus Configuration
# Phase 4 component. Scrapes all 4 MCP servers + K8s metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: dizaster
    project: androidmcp

scrape_configs:
  # MCP Servers
  - job_name: android-userspace
    static_configs:
      - targets: ['localhost:8110']
    metrics_path: /metrics

  - job_name: android-bootloader
    static_configs:
      - targets: ['localhost:8111']
    metrics_path: /metrics

  - job_name: k8s-orchestrator
    static_configs:
      - targets: ['localhost:8112']
    metrics_path: /metrics

  - job_name: network-tailscale
    static_configs:
      - targets: ['localhost:8113']
    metrics_path: /metrics

  # K8s API server (if minikube/k3s running)
  - job_name: kubernetes-apiservers
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https
